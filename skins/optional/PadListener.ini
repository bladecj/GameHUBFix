[Rainmeter]
Update=100
OnRefreshAction=[!ClickThrough 1][!ZPos -2][!KeepOnScreen 0][!Draggable 0]
AccurateText=1

; OPTIONAL EXAMPLE -- author's own machine only, NOT an install step.
; The standard host is GameHUB 2\Button\Button.ini (make it Active=1).
; Use this file only if Button is not always-on and you have another
; always-on skin to host the listener. See skins/README.md.
;
; GameHUBFix.dll is the ONLY plugin for this setup. It provides:
;   1 = a game is running -> Start must NOT open GameHUB (generic launch
;       session detection; no per-game names, works for future games)
;   layer fixes: skins / BitDock / taskbar behind full-screen games
; Config: Plugins\GameHUBFix.ini (Enabled / TickMs / SettleMs /
;         SessionMs / Coverage). Never written by Rainmeter.

[Metadata]
Name=Gamepad Start listener (always on)
Information=Fast, focus-independent Start gate for GameHUB 2. Do not deactivate.

; Number 1 = a game is running -> Start must NOT open GameHUB.
; Generic launch session clears the instant the game exits.
[MeasureGameGuard]
Measure=Plugin
Plugin=GameHUBFix
UpdateDivider=1

[GamepadActivation]
Measure=Plugin
Plugin=XInput
Device=0
Channel=Start
IfCondition=(GamepadActivation = 1) && (MeasureGameGuard = 0)
IfTrueAction=[!ActivateConfig "GameHUB 2" "GameHUB.ini"]
IfCondition2=GamepadActivation = 1
IfTrueAction2=[!Log "PadListener Start: [MeasureGameGuard:]"]
DynamicVariables=1

[GamepadActivation2]
Measure=Plugin
Plugin=XInput
Device=1
Channel=Start
IfCondition=(GamepadActivation2 = 1) && (MeasureGameGuard = 0)
IfTrueAction=[!ActivateConfig "GameHUB 2" "GameHUB.ini"]
DynamicVariables=1

[MeterDummy]
Meter=Image
W=1
H=1
SolidColor=0,0,0,1
